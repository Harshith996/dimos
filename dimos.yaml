# What dimOS Desktop reads to install and run this version of dimos (fetched over HTTP per tag, no git needed).
name: dimos
version: "0.0.14"
requires:
  dimos-desktop: ">=0.2 <0.3"
  dimcode: ">=0.1 <0.2"
# env: REF (this tag/branch), COMMIT (its commit), DIMOS_DIR (checkout to create), NON_INTERACTIVE=1 when no one can answer prompts
install: |
  set -euo pipefail
  script="$(mktemp)"
  # at an exact commit the raw file is never stale; a branch's raw file stays cached for minutes after a push, so
  # without a commit ask GitHub's API (rate-limited without a token), then fall back to raw
  raw="https://raw.githubusercontent.com/dimensionalOS/dimos/${COMMIT:-$REF}/scripts/install.sh"
  if [ -n "${COMMIT:-}" ] && [ "$COMMIT" != "$REF" ]; then
    curl -fsSL "$raw" -o "$script"
  else
    curl -fsSL -H "Accept: application/vnd.github.raw" ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} \
      "https://api.github.com/repos/dimensionalOS/dimos/contents/scripts/install.sh?ref=$REF" -o "$script" \
      || curl -fsSL "$raw" -o "$script"
  fi
  DIMOS_COMMIT="${COMMIT:-}" bash "$script" --mode dev --branch "$REF" --project-dir "$DIMOS_DIR" --skip-tests ${NON_INTERACTIVE:+--non-interactive}
  "$DIMOS_DIR/.venv/bin/python" -c "import dimos" && echo "dimos is installed in $DIMOS_DIR"
# Desktop's gateway contract; its implementation and metadata stay experimental.
api:
  version: "3.1.0"
# What this gateway serves (Desktop prefixes /dimos-gateway/); an app's `uses: "@dimos-gateway"` is checked against it.
# A test keeps it equal to the gateway's routes (experimental/gateway/tests/test_config.py).
provides:
  description: >-
    The dimos gateway: run and stop blueprints, read their config, modules, logs and skills, and upload recordings to the Dimensional cloud.
    Desktop serves it at /dimos-gateway/; GET openapi.json has every request and answer.
  endpoints:
    - method: GET
      path: info
      description: Whether dimos is found and installed, its version, the gateway API version, and the checkout's commit and desktop-gateway tag
    - method: GET
      path: paths
      description: The checkout, venv, runs and log directories
    - method: POST
      path: server/stop
      description: Stop this gateway (a running blueprint keeps running)
    - method: GET
      path: python
      description: The python that runs this dimos checkout
    - method: GET
      path: blueprints
      description: Every blueprint (builtin or external) with the last scan's results (importable, import_error, missing_module, suggested_extras, modules) and the scan's state; ?fresh= rereads
    - method: POST
      path: blueprints/scan
      description: '202 {job}: scan which blueprints import again (or join the running scan); follow it at jobs/{job}'
    - method: GET
      path: blueprints/{name}
      description: 'A blueprint''s modules with their streams, RPCs and skills, and its file and line (slow: imports python)'
    - method: GET
      path: blueprints/{name}/config
      description: A blueprint's configurable args per module and Desktop's saved values (slow)
    - method: PUT
      path: blueprints/{name}/config
      description: Save a blueprint's module arg overrides
    - method: GET
      path: catalog
      description: Every blueprint, module and skill, with docs (slow)
    - method: GET
      path: robots
      description: Robot types, their blueprints and recommended configs
    - method: GET
      path: global-config
      description: 'dimos''s GlobalConfig: schema, defaults, saved overrides and which keys are secret'
    - method: PUT
      path: global-config
      description: Save global config overrides
    - method: GET
      path: runs
      description: The live runs (dimos's run registry) and this gateway's launch (phase, output, runId, logDir)
    - method: POST
      path: runs
      description: Launch a blueprint with the saved config plus one-off overrides and args
    - method: POST
      path: runs/stop
      description: Stop the gateway's launch, or the run {runId}
    - method: POST
      path: runs/restart
      description: Stop and launch again with the config saved now; {runId} or a run the gateway didn't launch restarts with its own command line, directory and env
    - method: GET
      path: runs/{runId}/log
      description: A run's structured log (after, level, q, limit; runId may be latest)
    - method: GET
      path: cloud/account
      description: 'The Dimensional cloud account: loggedIn, email, source; ?fresh= rechecks'
    - method: GET
      path: cloud/login
      description: The device login in progress
    - method: POST
      path: cloud/login
      description: 'Start a device login: open the answer''s url and enter its code'
    - method: DELETE
      path: cloud/login
      description: Cancel the device login
    - method: POST
      path: cloud/logout
      description: Log out of the Dimensional cloud
    - method: GET
      path: cloud/uploads
      description: 'The cloud upload queue: each upload''s state, progress, speed, time left and error, and waitingForLogin'
    - method: POST
      path: cloud/uploads
      description: Queue a recording ({path}, robotId, kind) for upload to the Dimensional cloud
    - method: DELETE
      path: cloud/uploads
      description: Clear the finished uploads from the list
    - method: GET
      path: cloud/uploads/uploaded
      description: Which files are already in the cloud, by path, with a console link; ?path= for one
    - method: DELETE
      path: cloud/uploads/{id}
      description: Cancel a queued or running upload, or remove a finished one
    - method: POST
      path: cloud/uploads/{id}/retry
      description: Queue a finished upload again
    - method: GET
      path: skills
      description: The running blueprint's skills
    - method: POST
      path: skills/call
      description: Call one of the running blueprint's skills (skill, args, module, runId)
    - method: POST
      path: mcp
      description: An MCP server (JSON-RPC) with list_skills and call_skill for the running blueprint
    - method: GET
      path: extras
      description: 'dimos''s optional extras: installed, applicable, missing, download size'
    - method: POST
      path: extras/install
      description: '202 {job, command}: install extras with uv; follow it at jobs/{job}'
    - method: GET
      path: jobs/{job}
      description: 'A job (an extras install, a blueprint scan): done, ok, progress, error'
    - method: GET
      path: jobs/{job}/log
      description: A job's output lines after `after`
    - method: GET
      path: docs/custom-robot
      description: The guide to adding a robot
start: |
  "$DIMOS_DIR/.venv/bin/python" -m experimental.gateway --detach --dimos-dir "$DIMOS_DIR" --socket "$DIMOS_SERVER_SOCKET"
socket: |
  echo "$DIMOS_SERVER_SOCKET"
