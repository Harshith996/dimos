name: message-codegen

on:
  pull_request:
    paths:
      - setup.py
      - MANIFEST.in
      - packages/dimos-generated/**
      - scripts/*builtin*
      - dimos/msgs/*.py
      - dimos/msgs/nav_msgs/OccupancyGrid.py
      - examples/message-package/**
      - examples/external-messages/**
      - dimos/message_codegen/**
      - dimos/experimental/memory/**
      - dimos/memory/codecs/cdr.py
      - docs/development/cdr-recording.md
      - dimos/core/cdr_transport.py
      - dimos/core/test_cdr_transport.py
      - dimos/core/transport.py
      - dimos/msgs/protocol.py
      - dimos/protocol/pubsub/impl/webrtc/test_transport.py
      - dimos/protocol/pubsub/impl/rospubsub*.py
      - dimos/protocol/pubsub/impl/test_cdr_ros_conversion.py
      - native/cpp/**
      - native/rust/dimos-module/**
      - native/cpp/include/dimos/native/cdr_codec.hpp
      - docs/development/message-source-packages.md
      - docs/development/messages-external-project.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/message-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install published generator and consumer test tools
        run: |
          uv venv .venv --python 3.12 --seed
          uv pip install --python .venv/bin/python 'dimos-cdrgen[native,prepare]==0.1.1' numpy build pybind11 filelock tomli-w 'deno==2.6.10' pytest pytest-mock pytest-asyncio pytest-env
      - name: Verify DimOS SDK, installed Python consumer and C++ consumer
        run: |
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' -q dimos/message_codegen/test_integration.py dimos/message_codegen/test_build.py
      - name: Build main wheel and self-contained sdist
        run: |
          source .venv/bin/activate
          python -m build --no-isolation
      - name: Install the local shared build adapter and verify project planning
        run: |
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m pytest --noconftest -o addopts='' -q dimos/message_codegen/test_project.py
      - name: Prepare offline acceptance wheelhouse
        run: |
          root_wheel=(dist/dimos-*.whl)
          .venv/bin/python -m pip wheel "${root_wheel[0]}[message-build]" 'dimos-cdrgen[prepare]==0.1.1' 'deno==2.6.10' 'setuptools>=77' wheel pybind11 --wheel-dir build/bundle-wheelhouse
      - name: Verify installed main wheel, source, editable and external type identity
        env:
          DIMOS_BUNDLE_DIST: ${{ github.workspace }}/dist
          DIMOS_BUNDLE_WHEELHOUSE: ${{ github.workspace }}/build/bundle-wheelhouse
        run: .venv/bin/python -m pytest --noconftest -o addopts='' -q dimos/message_codegen/test_bundled.py
      - name: Verify ordinary isolated external package installs
        env:
          DIMOS_EXTERNAL_WHEELHOUSE: ${{ github.workspace }}/build/bundle-wheelhouse
        run: .venv/bin/python -m pytest --noconftest -o addopts='' -q dimos/message_codegen/test_project_install.py
      - name: Verify ordinary external CMake and Cargo builds
        env:
          DIMOS_EXTERNAL_NATIVE_PYTHON: ${{ github.workspace }}/.native-review/bin/python
          DIMOS_MESSAGE_NATIVE_CACHE: ${{ github.workspace }}/build/native-project-cache
        run: |
          uv venv .native-review --python 3.12 --seed
          .native-review/bin/python -m pip install --no-index --find-links build/bundle-wheelhouse 'dimos[message-build]==0.0.14'
          .venv/bin/python -m pytest --noconftest --import-mode=importlib -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' -q dimos/message_codegen/test_project_native.py

      - name: Prepare native SDK acceptance dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblcm-dev
          mkdir -p build/sdk-deps
          curl --fail --location --retry 3 https://github.com/eclipse-zenoh/zenoh-c/releases/download/1.10.1/zenoh-c-1.10.1-x86_64-unknown-linux-gnu-standalone.zip -o build/sdk-deps/zenoh-c.zip
          echo '9ee0f2d732b0f3042a7e1cd3076042a2bc3ac0415587c40bc3ed7b8b62fbde11  build/sdk-deps/zenoh-c.zip' | sha256sum --check
          unzip -q build/sdk-deps/zenoh-c.zip -d build/sdk-deps/zenoh-c
          git clone --depth 1 --branch 1.10.1 https://github.com/eclipse-zenoh/zenoh-cpp.git build/sdk-deps/zenoh-cpp
          test "$(git -C build/sdk-deps/zenoh-cpp rev-parse HEAD)" = 9626af8baa7535b6cea599a9cd56a7fc200a176b
          cmake -S build/sdk-deps/zenoh-cpp -B build/sdk-deps/zenoh-cpp-build -DCMAKE_PREFIX_PATH="$PWD/build/sdk-deps/zenoh-c" -DCMAKE_INSTALL_PREFIX="$PWD/build/sdk-deps/zenoh-cpp-install" -DZENOHCXX_ENABLE_TESTS=OFF -DZENOHCXX_ENABLE_EXAMPLES=OFF
          cmake --install build/sdk-deps/zenoh-cpp-build
          .native-review/bin/python -m pip install pytest pytest-mock pytest-env
      - name: Verify explicit CDR transports and actual SDK coordinator example
        if: runner.os == 'Linux'
        env:
          DIMOS_EXTERNAL_NATIVE_PYTHON: ${{ github.workspace }}/.native-review/bin/python
          DIMOS_MESSAGE_NATIVE_CACHE: ${{ github.workspace }}/build/native-project-cache
          DIMOS_CDR_NATIVE_SDK_PREFIX: ${{ github.workspace }}/build/sdk-deps/zenoh-c;${{ github.workspace }}/build/sdk-deps/zenoh-cpp-install
        run: |
          .native-review/bin/python -I scripts/verify_installed_tests.py "$PWD/dimos/core/test_cdr_transport.py" "$PWD/dimos/protocol/pubsub/impl/webrtc/test_transport.py" "$PWD/dimos/protocol/pubsub/impl/test_cdr_ros_conversion.py"
          .venv/bin/python -m pytest --noconftest --import-mode=importlib -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' -q dimos/message_codegen/test_project_native.py -k actual_coordinator
          cargo test --manifest-path native/rust/dimos-module/Cargo.toml --locked --features cdr --lib --jobs 2



      - name: Verify generated Python camera producers without hardware
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -I -c 'import dimos; import pytest; import sys; raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -q "$PWD/dimos/hardware/sensors/camera/test_webcam.py" "$PWD/dimos/hardware/sensors/camera/test_webcam_backend.py" "$PWD/dimos/hardware/sensors/camera/test_module.py" "$PWD/dimos/hardware/sensors/camera/realsense/test_camera.py" "$PWD/dimos/hardware/sensors/camera/gstreamer/test_generated_frames.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/hardware/sensors/camera/realsense/camera.py dimos/hardware/sensors/camera/spec.py dimos/hardware/sensors/camera/webcam.py dimos/hardware/sensors/camera/module.py dimos/hardware/sensors/camera/gstreamer/gstreamer_camera.py dimos/spec/perception.py dimos/visualization/vis_module.py
      - name: Verify generated native V4L2 producer without a device
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path native/rust/dimos-module-macros/Cargo.toml --locked --lib --jobs 2
          cargo test --manifest-path dimos/hardware/sensors/camera/v4l2/rust/Cargo.toml --locked --lib --jobs 2
          cargo clippy --manifest-path dimos/hardware/sensors/camera/v4l2/rust/Cargo.toml --locked --lib --jobs 2 -- -D warnings
      - name: Verify generated TF buffers and recorded lookups
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -m pip install 'mcap==1.5.0'
          .native-review/bin/python -I -c 'import dimos; import pytest; import sys; raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -o $'markers=self_hosted: optional host dependency case\nskipif_aarch64: optional architecture case' --strict-markers -m 'not self_hosted' -q "$PWD/dimos/protocol/tf/test_tf.py" "$PWD/dimos/protocol/tf/test_static_tf_publisher.py" "$PWD/dimos/memory/store/test_cdr_recording.py" "$PWD/dimos/protocol/test_cdr_mcap.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/protocol/tf/tf.py dimos/protocol/tf/static_tf_publisher.py dimos/memory/tf.py
      - name: Verify generated detection values and offline VLM image encoding
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -m pip install 'openai==2.21.0' 'transformers==4.53.3'
          .native-review/bin/python -m pip install 'https://download-r2.pytorch.org/whl/cpu/torch-2.7.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=8f8b3cfc53010a4b4a3c7ecb88c212e9decc4f5eeb6af75c3c803937d2d60947'
          .native-review/bin/python -I -c 'import dimos; import pytest; import sys; raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -o 'markers=self_hosted: optional project fixture case' --strict-markers -q "$PWD/dimos/perception/detection/type/detection2d/test_generated_bbox.py" "$PWD/dimos/perception/detection/type/detection3d/test_generated_projection.py" "$PWD/dimos/perception/detection/type/detection3d/test_generated_filters.py" "$PWD/dimos/perception/detection/type/detection3d/test_imageDetections3D.py" "$PWD/dimos/perception/detection/type/detection3d/test_marker.py" "$PWD/dimos/models/vl/test_base.py" "$PWD/dimos/perception/detection/detectors/test_generated_images.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/perception/detection/type dimos/perception/detection/module2D.py dimos/perception/detection/module3D.py dimos/perception/detection/detectors/base.py dimos/perception/detection/detectors/yolo.py dimos/perception/detection/detectors/person/yolo.py dimos/perception/detection/detectors/grounding_dino.py dimos/perception/detection/detectors/omdet.py dimos/perception/detection/detectors/owlv2.py dimos/perception/detection/detectors/yoloe.py dimos/perception/experimental/moduleDB.py dimos/models/vl/base.py dimos/models/vl/qwen.py dimos/types/timestamped.py --exclude '(test_.*|conftest\.py)'
      - name: Verify generated tracking and embedding image boundaries
        if: runner.os == 'Linux'
        env:
          HF_HUB_OFFLINE: '1'
          OMP_NUM_THREADS: '2'
        run: |
          .native-review/bin/python -I -c 'import dimos; import pytest; import sys; raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -q "$PWD/dimos/perception/detection/reid/test_generated_module.py" "$PWD/dimos/models/embedding/test_generated_images.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/perception/detection/person_tracker.py dimos/perception/detection/reid/module.py dimos/models/embedding/base.py dimos/models/embedding/clip.py dimos/models/embedding/dino.py dimos/models/embedding/siglip.py dimos/models/embedding/siglip2.py dimos/models/embedding/treid.py dimos/types/timestamped.py
      - name: Verify generated fiducial detections and TF without hardware
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -m pip install 'reportlab==4.5.0'
          .native-review/bin/python -I -c 'import dimos; import pytest; import sys; raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -q "$PWD/dimos/perception/fiducial/test_helpers.py" "$PWD"/dimos/perception/fiducial/test_*.py "$PWD"/dimos/perception/fiducial/blueprints/test_*.py
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/perception/fiducial/marker_pose.py dimos/perception/fiducial/marker_detect.py dimos/perception/fiducial/marker_transformer.py dimos/perception/fiducial/marker_detection_stream_module.py dimos/perception/fiducial/marker_tf_module.py dimos/perception/fiducial/blueprints/desk_marker_tf.py
      - name: Verify generated query-time localization geometry
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -I -c 'import dimos; import pytest; import sys; raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -q "$PWD/dimos/perception/localize/test_rig.py" "$PWD/dimos/perception/detection/type/detection3d/test_generated_projection.py" "$PWD/dimos/memory/store/test_cdr_recording.py" "$PWD/dimos/memory/codecs/test_codecs.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/perception/localize/association.py dimos/perception/localize/dandetect.py dimos/perception/localize/module.py dimos/perception/localize/rig.py dimos/perception/localize/support_plane.py dimos/perception/localize/types.py dimos/perception/localize/localize.py dimos/perception/localize/tools/tool_localize.py dimos/perception/localize/demo_blueprints/xarm_feed.py dimos/perception/detection/project.py dimos/memory/codecs/jpeg.py dimos/memory/codecs/base.py
      - name: Verify generated experimental objects, tracking and segmentation boundaries
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -m pip install 'hydra-core==1.3.2'
          .native-review/bin/python -I -c 'import dimos; import pytest; import sys; raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -o 'markers=self_hosted: optional heavyweight integration' --strict-markers -m 'not self_hosted' -q "$PWD/dimos/perception/experimental/test_object_generated.py" "$PWD/dimos/perception/experimental/test_object_scene_registration_temporal.py" "$PWD/dimos/perception/experimental/test_generated_tracker.py" "$PWD/dimos/perception/experimental/test_spatial_memory.py" "$PWD/dimos/models/segmentation/test_generated_edge_tam_images.py" "$PWD/dimos/models/segmentation/test_yoloe.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/perception/experimental/object.py dimos/perception/experimental/objectDB.py dimos/perception/experimental/object_scene_registration.py dimos/perception/experimental/object_scene_registration_spec.py dimos/perception/experimental/object_tracker.py dimos/perception/experimental/object_tracker_2d.py dimos/perception/experimental/object_tracker_3d.py dimos/perception/experimental/spatial_perception.py dimos/models/segmentation/edge_tam.py dimos/models/segmentation/yoloe.py
      - name: Verify generated temporal memory, PerceiveLoop and entity rendering
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -I -c 'import dimos; import pytest; import sys; raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -q "$PWD/dimos/perception/experimental/temporal_memory/test_temporal_memory_module.py" "$PWD/dimos/perception/experimental/test_perceive_loop_skill.py" "$PWD/dimos/visualization/rerun/test_cdr.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/perception/experimental/perceive_loop_skill.py dimos/perception/experimental/temporal_memory/clip_filter.py dimos/perception/experimental/temporal_memory/entity_graph_db.py dimos/perception/experimental/temporal_memory/frame_window_accumulator.py dimos/perception/experimental/temporal_memory/temporal_memory.py dimos/perception/experimental/temporal_memory/temporal_utils/helpers.py dimos/perception/experimental/temporal_memory/window_analyzer.py dimos/visualization/rerun/cdr.py
      - name: Verify generated ZED frames without the proprietary SDK
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -I -c 'from dimos.hardware.sensors.camera.zed import messages, compat; import pytest; import sys; assert all("site-packages" in str(module.__file__) for module in (messages, compat)); raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -q "$PWD/dimos/hardware/sensors/camera/zed/test_messages.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/hardware/sensors/camera/zed/camera.py dimos/hardware/sensors/camera/zed/compat.py dimos/hardware/sensors/camera/zed/messages.py
      - name: Verify native generated depth-cloud messages and point layouts
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -I -c 'from dimos.perception.depth2depth_cloud import module; import pytest; import sys; assert "site-packages" in str(module.__file__); raise SystemExit(pytest.main(sys.argv[1:]))' --noconftest --import-mode=importlib -o addopts='' -q "$PWD/dimos/perception/depth2depth_cloud/test_depth2depth_cloud_config.py"
          MYPYPATH="$PWD/build/message-source/python" .native-review/bin/python -m mypy --follow-imports=silent dimos/perception/depth2depth_cloud/module.py
          cargo test --locked --manifest-path dimos/perception/depth2depth_cloud/rust/Cargo.toml -j 2 --lib

      - name: Verify CDR control and teleop boundaries without hardware
        if: runner.os == 'Linux'
        env:
          DIMOS_TRANSPORT: lcm
          LCM_DEFAULT_URL: memq://
        run: |
          .native-review/bin/python -m pip install 'dimos[web,unitree]' 'onnxruntime' pytest-asyncio
          cd web/sdk
          deno install
          cd ../..
          .native-review/bin/python -I scripts/verify_installed_tests.py "$PWD/dimos/control/test_coordinator_routing.py" "$PWD/dimos/control/test_per_robot_joint_states.py" "$PWD/dimos/control/test_frame_pose_tf.py" "$PWD/dimos/control/tasks/cartesian_ik_task/test_cartesian_ik_task.py" "$PWD/dimos/control/tasks/teleop_ik_task/test_teleop_ik_task.py" "$PWD/dimos/control/tasks/eef_twist_task/test_eef_twist_task.py" "$PWD/dimos/control/tasks/gripper_task/test_gripper_task.py" "$PWD/dimos/teleop/webxr/test_module.py" "$PWD/dimos/teleop/webxr/test_body_tracking.py" "$PWD/dimos/teleop/webxr/test_blueprints.py" "$PWD/dimos/teleop/hosted/test_arm_command.py" "$PWD/dimos/teleop/keyboard/test_keyboard_teleop_module.py" "$PWD/dimos/core/test_cdr_transport.py" "$PWD/dimos/control/test_joint_commands.py" "$PWD/dimos/teleop/hosted/test_go2_command.py" "$PWD/dimos/teleop/hosted/test_map_compress.py"
      - name: Verify offline recording conversion and fidelity audit
        if: runner.os == 'Linux'
        run: |
          .native-review/bin/python -m pip install mcap pytest-asyncio
          .native-review/bin/python -I scripts/verify_installed_tests.py "$PWD/dimos/memory/test_convert_recording.py" "$PWD/dimos/memory/test_recording_migration.py"
      - name: Verify installed generated-value utilities
        run: |
          uv venv .values-review --python 3.12 --seed
          .values-review/bin/python -m pip install dist/*.whl pytest pytest-mock pytest-env
          .values-review/bin/python -I scripts/verify_installed_tests.py "$PWD/dimos/msgs/test_time.py" "$PWD/dimos/msgs/test_geometry.py" "$PWD/dimos/msgs/test_camera_info.py" "$PWD/dimos/msgs/test_image_views.py" "$PWD/dimos/msgs/test_image_compression.py" "$PWD/dimos/msgs/test_pointcloud.py" "$PWD/dimos/msgs/test_pointcloud_colors.py" "$PWD/dimos/msgs/test_occupancy.py"

  native-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install native recording test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm pkg-config libsqlite3-dev
          uv venv .record-review --python 3.12 --seed
          .record-review/bin/python -m pip install -e '.[web,unitree]' mcap onnxruntime pytest pytest-mock pytest-env pytest-asyncio
      - name: Verify schema planning and wrapper compatibility
        run: .record-review/bin/python -m pytest --noconftest -o addopts='' -q dimos/experimental/memory/test_cdr_schema.py dimos/experimental/memory/test_rust_recorder.py
      - name: Verify recording replay collection and dataset boundaries
        run: |
          .record-review/bin/python -m pytest --noconftest --import-mode=importlib -o addopts='' -q dimos/memory/codecs/test_codecs.py dimos/memory/store/test_cdr_recording.py dimos/memory/store/test_cdr_occupancy.py dimos/protocol/test_cdr_mcap.py dimos/teleop/utils/test_recorder.py dimos/teleop/utils/test_video_stats.py dimos/teleop/hosted/test_hosted_stats.py dimos/imitation/collection/test_recorder.py dimos/imitation/collection/test_blueprint.py dimos/imitation/dataprep/test_core.py dimos/imitation/dataprep/test_mcap_source.py
      - name: Verify native CDR storage and legacy codec tests
        run: |
          cargo test --manifest-path dimos/experimental/memory/rust/Cargo.toml --locked --lib --jobs 2
          cargo clippy --manifest-path dimos/experimental/memory/rust/Cargo.toml --locked --lib --no-deps --jobs 2 -- -D warnings
          cargo build --manifest-path dimos/experimental/memory/rust/Cargo.toml --locked --bin dimos-memory-recorder --jobs 2
      - name: Verify actual native recording and Python replay
        env:
          DIMOS_MEMORY_RECORDER_TEST_EXECUTABLE: ${{ github.workspace }}/target/debug/dimos-memory-recorder
        run: |
          .record-review/bin/python -m pytest --noconftest -o addopts='' -o 'markers=self_hosted: native recording acceptance' -q dimos/experimental/memory/test_rust_recorder_e2e.py -k cdr_native

  viewers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: denoland/setup-deno@v2
      - name: Build and check browser consumers
        run: |
          cd web/sdk
          deno task test src/decoders/cdr.test.ts
          deno task check
          deno task build
          cd ../cockpit
          deno task test src/subscriptions.test.ts
          deno task check
          deno task build
      - name: Build wheel and verify installed viewer adapters
        run: |
          uv venv .viewer-build --python 3.12 --seed
          .viewer-build/bin/python -m pip install '.[message-build]' build
          .viewer-build/bin/python -m build --wheel --no-isolation
          uv venv .viewer-review --python 3.12 --seed
          .viewer-review/bin/python -m pip install 'dimos[web,visualization]' dist/*.whl pytest pytest-mock pytest-env pytest-asyncio
          .viewer-review/bin/python -I scripts/verify_installed_tests.py "$PWD/dimos/web/test_cdr_codec.py" "$PWD/dimos/web/relay_bridge/test_relay_bridge_authoring.py" "$PWD/dimos/visualization/rerun/test_cdr.py" "$PWD/dimos/visualization/rerun/test_cdr_e2e.py" "$PWD/dimos/visualization/rerun/test_cdr_image_values.py" "$PWD/dimos/visualization/rerun/test_cdr_sensor_docs.py" "$PWD/dimos/memory/cli/test_render.py" "$PWD/dimos/navigation/global_planner/test_viz.py" "$PWD/dimos/navigation/local_planner/test_viz.py" "$PWD/dimos/navigation/local_planner/test_profile.py"

  clean-generator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install published generator and consumer test tools
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python 'dimos-cdrgen==0.1.1' numpy build pytest pytest-asyncio pytest-env
      - name: Verify SDK discovery and installed Python consumer without pip
        run: |
          .venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("pip") is None'
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' --strict-markers -m 'not native_e2e' -q dimos/message_codegen/test_integration.py
      - name: Verify compiled C++ consumer
        run: |
          .venv/bin/python -m pytest --noconftest -o addopts='' -o 'markers=native_e2e: compiled native consumer acceptance' --strict-markers -m native_e2e -q dimos/message_codegen/test_integration.py
          .venv/bin/python -c 'import importlib.util; assert importlib.util.find_spec("pip") is None; assert importlib.util.find_spec("catkin_pkg") is None'
