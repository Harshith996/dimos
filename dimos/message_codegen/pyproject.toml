[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimos-message-build"
version = "0.1.0"
description = "DimOS compatibility entry points for dimos-cdrgen"
requires-python = ">=3.10"
dependencies = ["dimos-cdrgen==0.1.0"]

[project.scripts]
dimos-message-generate = "dimos_message_build.source_package:main"

[project.optional-dependencies]
prepare = ["dimos-cdrgen[prepare]==0.1.0"]
native = ["dimos-cdrgen[native]==0.1.0"]

[tool.setuptools]
packages = ["dimos_message_build"]
package-dir = {"dimos_message_build" = "."}
include-package-data = false

[tool.setuptools.package-data]
dimos_message_build = ["py.typed"]
