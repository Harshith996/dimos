name: message-codegen

on:
  pull_request:
    paths:
      - setup.py
      - MANIFEST.in
      - packages/dimos-generated/**
      - scripts/*builtin*
      - examples/message-package/**
      - dimos/message_codegen/**
      - native/cpp/include/dimos/native/cdr_codec.hpp
      - docs/development/message-source-packages.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/message-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install published generator and consumer test tools
        run: |
          uv venv .venv --python 3.12 --seed
          uv pip install --python .venv/bin/python 'dimos-cdrgen[native]==0.1.1' numpy build pybind11 pytest pytest-asyncio pytest-env
      - name: Verify DimOS SDK, installed Python consumer and C++ consumer
        run: .venv/bin/python -m pytest --noconftest -o addopts='' -q dimos/message_codegen/test_integration.py
      - name: Prepare pinned built-in inputs
        run: uv run --no-project --with 'dimos-cdrgen[prepare]==0.1.1' python -m scripts.prepare_builtin_sources
      - name: Build main wheel and self-contained sdist
        env:
          # This job accepts message packaging only; release builds require the web bundles.
          DIMOS_ALLOW_MISSING_COCKPIT: "1"
        run: .venv/bin/python -m build --no-isolation
      - name: Prepare offline acceptance wheelhouse
        run: .venv/bin/python -m pip wheel 'dimos-cdrgen==0.1.1' 'setuptools>=70' wheel pybind11 --wheel-dir build/bundle-wheelhouse
      - name: Verify installed main wheel, source, editable and external type identity
        env:
          DIMOS_BUNDLE_DIST: ${{ github.workspace }}/dist
          DIMOS_BUNDLE_WHEELHOUSE: ${{ github.workspace }}/build/bundle-wheelhouse
        run: .venv/bin/python -m pytest --noconftest -o addopts='' -q dimos/message_codegen/test_bundled.py
